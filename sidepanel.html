<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>Easy Gemini v4.3.0</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      width: min(860px, 96vw);
    }

    h1 {
      margin: 0;
      font-size: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(128, 128, 128, .35);
      background: transparent;
    }

    select,
    button,
    input[type="number"],
    input[type="text"] {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(128, 128, 128, .35);
      background: transparent;
    }

    button.solid {
      background: #ffd54f;
      color: #1a1a1a;
      font-weight: 700;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .hint {
      font-size: 12px;
      color: gray;
    }

    .out {
      border: 1px solid rgba(128, 128, 128, .35);
      border-radius: 10px;
      padding: 10px 12px;
      white-space: pre-wrap;
      min-height: 120px;
      font-size: 1rem;
      line-height: 1.5;
    }

    .out.empty {
      color: gray;
    }

    .sep {
      height: 1px;
      background: rgba(128, 128, 128, .25);
    }

    /* ▼ タブを縦に独立ボタンで表示 */
    .tabstack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid rgba(128, 128, 128, .35);
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .tab.active {
      background: #ffd54f;
      color: #1a1a1a;
      border-color: #ffd54f;
    }

    .tab .x {
      border: 0;
      background: transparent;
      font-weight: 700;
      cursor: pointer;
    }

    .add-tab {
      width: 100%;
      padding: 8px 12px;
      border: 1px dashed rgba(128, 128, 128, .5);
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
    }

    .tabwrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .82);
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      z-index: 9999;
      display: none;
    }

    /* 履歴モーダル */
    .history-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      overflow-y: auto;
    }

    .history-overlay.open {
      display: flex;
    }

    .history-modal {
      background: var(--bg, #1a1a1a);
      border-radius: 16px;
      width: min(700px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    @media (prefers-color-scheme: light) {
      .history-modal {
        --bg: #fff;
      }
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .history-close {
      background: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      border: 1px solid rgba(128, 128, 128, .35);
      border-radius: 12px;
      padding: 12px;
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: gray;
    }

    .history-item-model {
      font-weight: 700;
      color: #ffd54f;
    }

    .history-item-content {
      font-size: 13px;
      line-height: 1.5;
    }

    .history-item-tpl,
    .history-item-src,
    .history-item-out {
      margin-bottom: 8px;
      padding: 8px;
      background: rgba(128, 128, 128, .1);
      border-radius: 8px;
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
    }

    .history-item-label {
      font-size: 11px;
      font-weight: 700;
      color: gray;
      margin-bottom: 4px;
    }

    .history-item-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .history-item-actions button {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid rgba(128, 128, 128, .35);
      background: transparent;
      cursor: pointer;
    }

    .history-item-actions button.reuse {
      background: #ffd54f;
      color: #1a1a1a;
      border-color: #ffd54f;
    }

    .history-item-actions button.delete {
      color: #f44336;
      border-color: #f44336;
    }

    .history-empty {
      text-align: center;
      color: gray;
      padding: 40px 0;
    }


    .preset-picker {
      min-width: 260px;
      max-height: 220px;
      overflow: auto;
      border: 1px solid rgba(128, 128, 128, .35);
      border-radius: 10px;
      padding: 6px;
    }

    .preset-folder {
      border-bottom: 1px solid rgba(128, 128, 128, .18);
    }

    .preset-folder:last-child {
      border-bottom: 0;
    }

    .preset-folder summary {
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      color: gray;
    }

    .preset-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 0 6px 12px;
    }

    .preset-option {
      width: 100%;
      text-align: left;
      border: 0;
      border-radius: 8px;
      padding: 7px 8px;
      background: transparent;
    }

    .preset-option.active {
      background: rgba(255, 213, 79, .25);
    }

    .preset-empty {
      padding: 8px;
      color: gray;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="row" style="justify-content: space-between;">
      <h1>Easy Gemini v4.3.0 <small id="ver" class="hint"></small></h1>
      <div class="row">
        <button id="googleAuthBtn" style="font-size:12px; display:none;">G Sign in</button>
        <button id="openHistory">📚 履歴</button>
        <button id="openKey">設定</button>
        <button id="openManager">プリセット & Skill管理</button>
      </div>
    </header>

    <div id="needKey" class="hint" style="display:none;color:#d32f2f;font-weight:700;">
      まず「設定」から Gemini API キーを保存してください。
    </div>

    <!-- ▼ タブボタンを縦積みで表示。新規は常に下に追加される -->
    <section class="tabwrap">
      <div id="tabbar" class="tabstack" role="tablist" aria-label="sessions"></div>
      <button id="addTab" class="add-tab">＋ 新規タブ</button>
    </section>

    <!-- セッションの内容は JS で #pane にレンダリング -->
    <div id="pane"></div>
  </div>

  <!-- コンテンツテンプレート（複製して使う） -->
  <template id="tpl-session">
    <section class="session">
      <div class="row">
        <label class="row">Model
          <select data-k="model">
            <option value="gemini-3.6-flash" selected>Gemini 3.6 Flash</option>
            <option value="gemini-3.5-pro">Gemini 3.5 Pro</option>
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option disabled>──────────</option>
            <option value="local-gemma-4-e2b">Gemma 4 E2B (Local)</option>
            <option value="local-gemma-4-e4b">Gemma 4 E4B (Local)</option>
            <option value="local-gemma-4-26b-a4b">Gemma 4 26B A4B (Local)</option>
            <option value="local-gemma-4-31b">Gemma 4 31B (Local)</option>
            <option value="local-qwen3.8-27b">Qwen3.8 27B (Local)</option>
            <option disabled>──────────</option>
            <option value="claude-fable-5">Claude Fable 5</option>
            <option value="claude-opus-5">Claude Opus 5</option>
            <option value="claude-sonnet-5">Claude Sonnet 5</option>
            <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
            <option disabled>──────────</option>
            <option value="gpt-5.6">GPT-5.6</option>
            <option value="gpt-5.6-terra">GPT-5.6 Terra</option>
            <option value="gpt-5.6-luna">GPT-5.6 Luna</option>
            <option disabled>──────────</option>
            <option value="grok-4.3">Grok 4.3</option>
            <option value="grok-4.3-latest">Grok 4.3 latest</option>
            <option value="grok-4.20">Grok 4.20</option>
            <option value="grok-4-1-fast-reasoning">Grok 4.1 Fast (Reasoning)</option>
            <option value="grok-4-1-fast-non-reasoning">Grok 4.1 Fast</option>
            <option disabled>──────────</option>
            <option value="local-llm">ローカルLLM (カスタム)</option>
            <option disabled>──────────</option>
            <option value="hermes-grok-oauth-wsl">Hermes Grok OAuth (WSL)</option>
            <option value="hermes-gpt-5.5-wsl">GPT-5.5 (Hermes WSL)</option>
            <option value="codex-app-server">Codex App Server (Local)</option>
          </select>
        </label>
        <label id="thinkingWrap" class="row hint" style="display:none;">
          <input type="checkbox" data-k="thinking"> Thinking Mode
        </label>
        <span class="hint">⌘/Ctrl + Enter で実行</span>
        <span style="flex:1;"></span>
        <label class="row hint">タイトル
          <input data-k="title" type="text" placeholder="タブ名（自動連番・手入力で上書き可）" style="min-width:200px;">
        </label>
      </div>

      <section>
        <div><strong>指示（カスタムプロンプト / Skill）</strong> <span class="hint">プリセット選択・SKILL.mdドロップ対応</span></div>
        <textarea data-k="tpl" placeholder="例）次のテキストを編集者視点で推敲。（SKILL.md ファイルのドロップ読み込みに対応）"></textarea>
      </section>

      <section>
        <div class="row" style="justify-content:space-between;">
          <div class="row">
            <label class="row">プリセット / Skill
              <input data-k="presetSel" type="hidden">
              <div data-k="presetPicker" class="preset-picker" role="tree"></div>
            </label>
            <button data-k="insertPreset">挿入</button>
          </div>
          <div class="row">
            <button data-k="exportPresets">書き出し</button>
            <button data-k="importBtn">読み込み</button>
            <input data-k="importInput" class="hidden" type="file" accept=".json,.md,.markdown,text/markdown,application/json" style="display:none;">
          </div>
        </div>
      </section>

      <section>
        <div class="row" style="justify-content:space-between; align-items:center;">
          <strong>適用対象テキスト（素材）</strong>
          <button data-k="grabPage" title="アクティブタブの本文を取得">メインタブの本文を取得</button>
        </div>
        <textarea data-k="src" placeholder="ここに素材テキストを入力／貼り付け"></textarea>
      </section>

      <div class="sep"></div>

      <section class="row">
        <button data-k="gen" class="solid">Generate</button>
        <button data-k="cancel" style="display:none;">キャンセル</button>
        <button data-k="copy" title="出力をコピー">📋 コピー</button>
        <span data-k="status" class="hint"></span>
      </section>

      <section>
        <div><strong>AIの返答</strong></div>
        <div data-k="out" class="out empty">結果がここに表示されます。</div>
      </section>
    </section>
  </template>

  <div id="toast" class="toast"></div>

  <!-- 履歴モーダル -->
  <div id="historyOverlay" class="history-overlay">
    <div class="history-modal">
      <div class="history-header">
        <h2>📚 履歴</h2>
        <button id="historyClose" class="history-close">×</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script src="sidepanel.js" defer></script>
</body>

</html>
